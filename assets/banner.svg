<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d1524"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de1c1"/>
      <stop offset="0.5" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#ff6ac1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de1c1"/>
      <stop offset="1" stop-color="#5cc8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#1b3a44" stroke-width="1" opacity="0.35">
    <g>
      <line x1="0" y1="55" x2="1280" y2="55"/><line x1="0" y1="110" x2="1280" y2="110"/>
      <line x1="0" y1="165" x2="1280" y2="165"/><line x1="0" y1="220" x2="1280" y2="220"/>
      <line x1="0" y1="275" x2="1280" y2="275"/><line x1="0" y1="330" x2="1280" y2="330"/>
      <line x1="0" y1="385" x2="1280" y2="385"/>
    </g>
    <g>
      <line x1="55" y1="0" x2="55" y2="440"/><line x1="165" y1="0" x2="165" y2="440"/>
      <line x1="275" y1="0" x2="275" y2="440"/><line x1="385" y1="0" x2="385" y2="440"/>
      <line x1="495" y1="0" x2="495" y2="440"/><line x1="605" y1="0" x2="605" y2="440"/>
      <line x1="715" y1="0" x2="715" y2="440"/><line x1="825" y1="0" x2="825" y2="440"/>
      <line x1="935" y1="0" x2="935" y2="440"/><line x1="1045" y1="0" x2="1045" y2="440"/>
      <line x1="1155" y1="0" x2="1155" y2="440"/>
    </g>
  </g>
  <!-- glow blobs -->
  <circle cx="120" cy="60" r="240" fill="#4de1c1" opacity="0.06"/>
  <circle cx="1180" cy="40" r="260" fill="#5cc8ff" opacity="0.06"/>

  <!-- crosshair / target mark -->
  <g transform="translate(95,112)" filter="url(#glow)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <circle cx="0" cy="0" r="38" opacity="0.9"/>
    <circle cx="0" cy="0" r="16" opacity="0.9"/>
    <line x1="0" y1="-54" x2="0" y2="-30"/>
    <line x1="0" y1="30" x2="0" y2="54"/>
    <line x1="-54" y1="0" x2="-30" y2="0"/>
    <line x1="30" y1="0" x2="54" y2="0"/>
    <circle cx="0" cy="0" r="4" fill="#ff6ac1" stroke="none"/>
  </g>

  <!-- title -->
  <text x="190" y="150" font-size="96" font-weight="700" fill="url(#title)" filter="url(#glow)" letter-spacing="2">NXCSPRAY</text>

  <!-- subtitle -->
  <text x="192" y="196" font-size="24" fill="#c4cdd9" letter-spacing="1">credential spraying over NetExec
    <tspan fill="#4de1c1">  ·  Windows / AD / Linux</tspan>
  </text>

  <!-- author rainbow -->
  <text x="192" y="238" font-size="22" font-weight="700" letter-spacing="3">
    <tspan fill="#8492a4" font-weight="400">coded by  </tspan><tspan fill="#ff5f5f">f</tspan><tspan fill="#ffb454">r</tspan><tspan fill="#39ff9d">x</tspan><tspan> </tspan><tspan fill="#4de1c1">a</tspan><tspan fill="#5cc8ff">r</tspan><tspan fill="#ff6ac1">f</tspan><tspan fill="#ff5f5f">a</tspan><tspan fill="#ffb454">t</tspan><tspan fill="#39ff9d">h</tspan>
    <tspan fill="#3b5566" font-weight="400">    ·  github.com/frxarfath404</tspan>
  </text>

  <!-- terminal mock -->
  <g transform="translate(150,268)">
    <rect x="0" y="0" width="980" height="150" rx="10" fill="#0c1017" stroke="#23303e"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f56"/><circle cx="40" cy="20" r="6" fill="#ffbd2e"/><circle cx="60" cy="20" r="6" fill="#27c93f"/>
    <text x="90" y="24" font-size="13" fill="#5b6a7d">nxcspray — spray summary</text>
    <text x="20" y="58" font-size="15" fill="#e6edf5"><tspan fill="#8492a4">$</tspan> nxcspray -t 10.10.10.0/24 -U users.txt -P pass.txt <tspan fill="#ff6ac1">--both</tspan></text>
    <text x="20" y="86" font-size="15"><tspan fill="#39ff9d" font-weight="700">[VALID]</tspan><tspan fill="#c4cdd9">  SMB    10.10.10.10   corp\alice:Summer2026!</tspan></text>
    <text x="20" y="112" font-size="15"><tspan fill="#ff5f5f" font-weight="700">[PWNED]</tspan><tspan fill="#ff9d9d">  WINRM  10.10.10.11   corp\admin:P@ssw0rd (Pwn3d!)</tspan></text>
    <text x="20" y="138" font-size="15"><tspan fill="#ff5f5f" font-weight="700">[PWNED]</tspan><tspan fill="#ff9d9d">  SMB    10.10.10.12   .\localadmin:Local123 (Pwn3d!)</tspan></text>
  </g>

  <!-- protocol chips -->
  <g font-size="15" font-weight="600">
    <g transform="translate(1140,278)">
      <rect x="-1" y="0" width="120" height="26" rx="13" fill="#10261f" stroke="#1f5e4a"/><text x="18" y="18" fill="#4de1c1">SMB</text>
      <rect x="-1" y="34" width="120" height="26" rx="13" fill="#0f1f2e" stroke="#1f5e7a"/><text x="14" y="52" fill="#5cc8ff">WINRM</text>
      <rect x="-1" y="68" width="120" height="26" rx="13" fill="#241023" stroke="#5e1f4a"/><text x="18" y="86" fill="#ff6ac1">LDAP</text>
      <rect x="-1" y="102" width="120" height="26" rx="13" fill="#26210f" stroke="#5e4a1f"/><text x="10" y="120" fill="#ffb454">RDP·SSH</text>
    </g>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="434" width="1280" height="6" fill="url(#accent)"/>
</svg>
